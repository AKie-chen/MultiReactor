name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure (gcc)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"

      - name: Configure (clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Smoke test
        run: |
          ./build/main -p 18080 -i 2 -w 4 -d . -t 10 --log-level INFO &
          SERVER_PID=$!
          sleep 2
          # 基础路由
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl -s http://127.0.0.1:18080/)" = "Hello, World!"
          # 动态路由
          test "$(curl -s http://127.0.0.1:18080/user/42)" = "user id: 42"
          # 指标端点
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/stats)" = "200"
          # 错误处理
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/nonexist)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/)" = "405"
          # HEAD 等价 GET
          test "$(curl -s -I -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "200"
          # 优雅关闭
          kill -TERM $SERVER_PID
          wait $SERVER_PID
